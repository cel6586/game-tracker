apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-tracker
  namespace: game-tracker
spec:
  ingressClassName: traefik
  rules:
    - host: game-tracker.homelab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080