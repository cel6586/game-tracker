apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: game-tracker
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: game-tracker-api
  template:
    metadata:
      labels:
        app: game-tracker-api
    spec:
      imagePullSecrets:
        - name: {{ .Values.pullSecret }}
      containers:
        - name: api
          image: {{ .Values.api.image }}:{{ .Values.image.tag }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: game-tracker-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://gtadmin:$(POSTGRES_PASSWORD)@db:5432/gametracker
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: game-tracker-secrets
                  key: SECRET_KEY
            - name: SIGNUP_CODE
              valueFrom:
                secretKeyRef:
                  name: game-tracker-secrets
                  key: SIGNUP_CODE
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: game-tracker
spec:
  selector:
    app: game-tracker-api
  ports:
    - port: 8000
      targetPort: 8000

