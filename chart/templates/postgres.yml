apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: game-tracker-db-data
  namespace: game-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: game-tracker
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: game-tracker-db
  template:
    metadata:
      labels:
        app: game-tracker-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: gtadmin
            - name: POSTGRES_DB
              value: gametracker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: game-tracker-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: game-tracker-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: game-tracker
spec:
  selector:
    app: game-tracker-db
  ports:
    - port: 5432
      targetPort: 5432