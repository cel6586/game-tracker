services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gtadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gametracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gtdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtadmin -d gametracker"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  gtdata: