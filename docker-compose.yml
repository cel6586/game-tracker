services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gtadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gametracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gtdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtadmin -d gametracker"]
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build: ./api
    image: ghcr.io/cel6586/game-tracker-api:v1
    environment:
      DATABASE_URL: postgresql+psycopg://gtadmin:${POSTGRES_PASSWORD}@db:5432/gametracker
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    image: ghcr.io/cel6586/game-tracker-web:v1
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started


volumes:
  gtdata: