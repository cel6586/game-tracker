# GitLab version of the pipeline. Ported from .github/workflows/build.yml one job at a time.

stages: [test, build, deploy]

variables:
  API_IMAGE: $CI_REGISTRY_IMAGE/api
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web

test:
  stage: test
  image: python:3.13
  script:
    - cd api
    - pip install -r requirements-dev.txt
    - pytest
    - ruff check .

secret-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --verbose

# Runs by itself on main.
build:
  stage: build
  image: docker:27
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $API_IMAGE:$CI_COMMIT_SHA ./api
    - docker build -t $WEB_IMAGE:$CI_COMMIT_SHA ./web
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $API_IMAGE:$CI_COMMIT_SHA
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $WEB_IMAGE:$CI_COMMIT_SHA
    - docker push $API_IMAGE:$CI_COMMIT_SHA
    - docker push $WEB_IMAGE:$CI_COMMIT_SHA

# Manual until the GitHub deploy is retired, so the two don't deploy over each other.
deploy:
  stage: deploy
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    # helm doesn't use the runner's CA file by itself, so point it at it
    - export SSL_CERT_FILE=$CI_SERVER_TLS_CA_FILE
    - >
      helm upgrade --install game-tracker chart
      --kube-context craig-homelab/game-tracker:homelab
      --namespace game-tracker
      --create-namespace
      --set api.image=$API_IMAGE
      --set web.image=$WEB_IMAGE
      --set image.tag=$CI_COMMIT_SHA
      --set pullSecret=gitlab-pull
      --wait